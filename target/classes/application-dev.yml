spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/shakepro?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ShakeProDevSecretKeyForJWT2024MustBeAtLeast256BitsLong!!}
  expiration-seconds: 86400  # 24 hours

# OSS / MinIO Configuration
oss:
  type: minio
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:shakepro}
  public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/shakepro}
  presign-expire-seconds: 3600

# AI Configuration
ai:
  provider: ${AI_PROVIDER:mock}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:sk-mock-key}
  model: ${AI_MODEL:gpt-3.5-turbo}
  timeout-ms: ${AI_TIMEOUT:45000}
  qwen:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    api-key: ${QWEN_API_KEY:${AI_API_KEY:sk-mock-key}}
    model: ${QWEN_MODEL:qwen-plus}
    timeout-ms: ${QWEN_TIMEOUT:45000}
