spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/shakepro?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION:86400}

oss:
  type: ${OSS_TYPE:minio}
  endpoint: ${OSS_ENDPOINT}
  access-key: ${OSS_ACCESS_KEY}
  secret-key: ${OSS_SECRET_KEY}
  bucket: ${OSS_BUCKET}
  public-base-url: ${OSS_PUBLIC_URL}
  presign-expire-seconds: 3600

ai:
  provider: ${AI_PROVIDER:openai}
  base-url: ${AI_BASE_URL}
  api-key: ${AI_API_KEY}
  model: ${AI_MODEL}
  timeout-ms: ${AI_TIMEOUT:45000}
  qwen:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    api-key: ${QWEN_API_KEY}
    model: ${QWEN_MODEL:qwen-plus}
    timeout-ms: ${QWEN_TIMEOUT:45000}

logging:
  level:
    com.shakepro: INFO
