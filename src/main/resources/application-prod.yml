spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/shakepro?useSSL=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION:86400}

oss:
  type: ${OSS_TYPE:aliyun}
  endpoint: ${OSS_ENDPOINT}
  access-key: ${OSS_ACCESS_KEY}
  secret-key: ${OSS_SECRET_KEY}
  bucket: ${OSS_BUCKET}
  public-base-url: ${OSS_PUBLIC_URL}
  presign-expire-seconds: 3600
  image-style:
    thumb: ${OSS_IMAGE_STYLE_THUMB:thumb}
    card: ${OSS_IMAGE_STYLE_CARD:card}
    detail: ${OSS_IMAGE_STYLE_DETAIL:detail}

ai:
  provider: ${AI_PROVIDER:openai}
  base-url: ${AI_BASE_URL}
  api-key: ${AI_API_KEY}
  model: ${AI_MODEL}
  timeout-ms: ${AI_TIMEOUT:45000}
  qwen:
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    api-key: ${QWEN_API_KEY}
    model: ${QWEN_MODEL:qwen-plus}
    timeout-ms: ${QWEN_TIMEOUT:45000}

barcode:
  lookup:
    enabled: ${BARCODE_LOOKUP_ENABLED:true}
    base-url: ${BARCODE_BASE_URL:https://world.openfoodfacts.org}
    timeout-ms: ${BARCODE_TIMEOUT:3500}
    cache-hours: ${BARCODE_CACHE_HOURS:168}
    user-agent: ${BARCODE_USER_AGENT:ShakeProBackend/1.0}

cocktaildb:
  enabled: ${COCKTAILDB_ENABLED:true}
  base-url: ${COCKTAILDB_BASE_URL:https://www.thecocktaildb.com}
  api-key: ${COCKTAILDB_API_KEY:1}
  connect-timeout-ms: ${COCKTAILDB_CONNECT_TIMEOUT:5000}
  read-timeout-ms: ${COCKTAILDB_READ_TIMEOUT:10000}
  sync:
    max-items: ${COCKTAILDB_SYNC_MAX_ITEMS:1000}
    dry-run: ${COCKTAILDB_SYNC_DRY_RUN:false}
    overwrite-image: ${COCKTAILDB_SYNC_OVERWRITE_IMAGE:false}
    oss-prefix: ${COCKTAILDB_SYNC_OSS_PREFIX:uploads/materials/cocktaildb}

logging:
  level:
    com.shakepro: INFO
